name: Mod asset and compatibility scan
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mod-review-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install -r scanner/requirements.txt
      - run: PYTHONPATH=scanner python -m unittest discover -s scanner/tests
      - run: node --test scripts/test.mjs scripts/moderation.test.mjs
  scan:
    runs-on: [self-hosted, Linux, ARM64, mod-scan]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan release assets and API usage
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REFERENCE_IMAGES: /references
        run: |
          args=()
          # A PR checks out its merge commit, whose first parent is main as it
          # stands now. pull_request.base.sha can be days stale, which made the
          # scan re-check every entry merged since the PR was opened.
          if [ "$EVENT_NAME" = "pull_request" ]; then args+=(--base "$(git rev-parse HEAD^1)"); fi
          python /opt/scanner/cli.py --root "$GITHUB_WORKSPACE" --cache /scan-cache --output "$RUNNER_TEMP/scan-report.json" "${args[@]}"
      - name: Save review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mod-scan-report
          path: ${{ runner.temp }}/scan-report.json
          retention-days: 14
          if-no-files-found: warn
