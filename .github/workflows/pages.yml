name: Build index and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    # Nightly: re-read every tracked repo's Releases so index.json follows
    # version bumps without anyone opening a pull request.
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, Linux, ARM64, mod-scan]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build index
        env:
          GITHUB_TOKEN: ${{ secrets.MOD_INDEX_API_TOKEN || github.token }}
        run: node scripts/build-index.mjs --releases

      - name: Gate resolved releases before publication
        env:
          GITHUB_TOKEN: ${{ secrets.MOD_INDEX_API_TOKEN || github.token }}
          REFERENCE_IMAGES: /references
        run: python /opt/scanner/cli.py --root "$GITHUB_WORKSPACE" --gate-index site/data/index.json --cache /scan-cache --output "$RUNNER_TEMP/scan-report.json"

      - name: Save asset review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mod-scan-report
          path: ${{ runner.temp }}/scan-report.json
          retention-days: 14
          if-no-files-found: warn

      - name: Summarize
        run: |
          {
            echo '### index.json'
            echo
            node -e "const i=require('./site/data/index.json');
              console.log('- ' + i.count + ' mod(s), ' + i.cart_count + ' cart(s), generated ' + i.generated_at);
              for (const m of [...i.mods, ...i.carts]) console.log('- \`' + m.folder + '\` ' + (m.latest ? m.latest.version + ' (' + m.update_check + ')' : m.update_check));"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
